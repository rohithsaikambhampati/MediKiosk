version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: medikiosk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medikiosk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medikiosk_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medikiosk_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medikiosk_user} -d ${POSTGRES_DB:-medikiosk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://medikiosk_user:medikiosk_pass@db:5432/medikiosk_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-medikiosk-production-super-secret-key-change-in-env}
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
      - UPLOAD_DIR=/app/storage/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage

volumes:
  postgres_data:
  backend_storage:
